# Taste Alchemy · VirtualHost de Apache (producción / Docker)
#
# El front controller es public/index.php. Todo el tráfico que no sea un
# fichero real de public/ se reescribe hacia él.

<VirtualHost *:80>
    ServerName taste-alchemy.local
    DocumentRoot /var/www/html/public

    # Apache elimina la cabecera Authorization por defecto. La restituimos como
    # HTTP_AUTHORIZATION para que el front controller pueda leer el token Bearer.
    CGIPassAuth On
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # Si el fichero o directorio existe, servirlo tal cual.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Nunca exponer el código fuente, la configuración ni los datos.
    <DirectoryMatch "^/var/www/html/(src|config|database|bin|tests|java|tools|var|routes|views)">
        Require all denied
    </DirectoryMatch>

    # Cabeceras de seguridad básicas.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/taste-alchemy-error.log
    CustomLog ${APACHE_LOG_DIR}/taste-alchemy-access.log combined
</VirtualHost>